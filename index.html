<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>将棋盤</title>
<style>
  :root {
    --bg: #f3ead7;
    --board: #e8c37a;
    --line: #5a3d17;
    --red: #f6c4c4;
    --piece: #fbe9c4;
    --piece-edge: #8a6326;
    --select: #2f7de1;
    --hand: #e6d6b3;
    --w: min(92vw, 48vh, 480px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 16px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .palette {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    width: var(--w);
  }
  .gote .piece { transform: rotate(180deg); }
  .board {
    display: grid;
    grid-template-columns: repeat(9, minmax(0, 1fr));
    grid-template-rows: repeat(9, minmax(0, 1fr));
    width: var(--w);
    aspect-ratio: 1;
    background: var(--board);
    border: 2px solid var(--line);
  }
  .cell {
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    min-width: 0;
    min-height: 0;
  }
  .cell .piece { width: auto; height: 90%; }
  .cell.red { background: var(--red); }
  .piece {
    width: 88%;
    aspect-ratio: 0.9;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--piece);
    border: 1px solid var(--piece-edge);
    clip-path: polygon(50% 0, 85% 15%, 100% 100%, 0 100%, 15% 15%);
    font-size: min(4.6vw, 2.6vh, 24px);
    font-weight: bold;
    line-height: 1;
    color: #222;
  }
  .piece.promoted { color: #c0201a; }
  .slot {
    aspect-ratio: 0.9;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
  }
  .slot .piece { width: 90%; font-size: min(5vw, 2.8vh, 26px); }
  .slot.selected { background: var(--select); }
  .hand {
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    gap: 4px;
    width: var(--w);
    min-height: calc(var(--w) / 9 + 8px);
    padding: 4px;
    background: var(--hand);
    border: 1px dashed var(--piece-edge);
    border-radius: 6px;
    cursor: pointer;
  }
  .hand.gote { flex-direction: row-reverse; }
  .hand .slot { width: calc(var(--w) / 9); }
  .count {
    position: absolute;
    right: -2px;
    bottom: -2px;
    min-width: 16px;
    padding: 0 3px;
    border-radius: 8px;
    background: #5a3d17;
    color: #fff;
    font: bold 11px/16px sans-serif;
    text-align: center;
  }
  .hand.gote .count { right: auto; left: -2px; bottom: auto; top: -2px; }
  .tools { display: flex; gap: 8px; }
  .tools button {
    font: 14px sans-serif;
    padding: 8px 14px;
    border: 1px solid var(--piece-edge);
    border-radius: 6px;
    background: var(--piece);
    color: #222;
    cursor: pointer;
  }
  .tools button.selected { background: var(--select); color: #fff; border-color: var(--select); }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .panel {
    --w: min(80vw, 46vh, 420px);
    background: var(--bg);
    border-radius: 10px;
    padding: 16px;
    max-height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: calc(var(--w) + 32px);
    max-width: 100%;
  }
  .panel h2 { margin: 0; font-size: 18px; }
  .panel .board, .panel .hand { cursor: default; }
  .panel .cell { cursor: default; }
  .save-list { list-style: none; margin: 0; padding: 0; width: 100%; }
  .save-list li {
    padding: 12px;
    border-bottom: 1px solid var(--hand);
    cursor: pointer;
    font-family: sans-serif;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .save-list li:hover { background: var(--hand); }
  .save-list .date { color: #6b5a3c; font-size: 12px; white-space: nowrap; }
  .empty { font-family: sans-serif; color: #6b5a3c; padding: 12px; }
  .hint { font-size: 12px; color: #6b5a3c; text-align: center; font-family: sans-serif; }
</style>
</head>
<body>
  <div class="palette gote" id="palette-gote"></div>
  <div class="hand gote" id="hand-gote"></div>
  <div class="board" id="board"></div>
  <div class="hand sente" id="hand-sente"></div>
  <div class="palette sente" id="palette-sente"></div>
  <div class="tools">
    <button id="btn-hon">本将棋</button>
    <button id="btn-erase">消す</button>
    <button id="btn-clear">全消去</button>
  </div>
  <div class="tools">
    <button id="btn-save">保存</button>
    <button id="btn-list">保存一覧</button>
  </div>
  <div class="overlay" id="list-view" hidden>
    <div class="panel">
      <h2>保存一覧</h2>
      <ul class="save-list" id="save-list"></ul>
      <div class="tools"><button data-close>閉じる</button></div>
    </div>
  </div>
  <div class="overlay" id="detail-view" hidden>
    <div class="panel">
      <h2 id="detail-title"></h2>
      <div class="hand gote" id="detail-hand-gote"></div>
      <div class="board" id="detail-board"></div>
      <div class="hand sente" id="detail-hand-sente"></div>
      <div class="tools">
        <button id="btn-load">この盤面を読み込む</button>
        <button id="btn-delete">削除</button>
        <button id="btn-back">戻る</button>
      </div>
    </div>
  </div>
  <div class="hint">
    駒をタップ → マス(または持ち駒欄)をタップで配置 / 持ち駒をタップ → マスで打つ<br>
    駒を右クリックで成る / 空きマスを右クリックで赤くする / 「消す」→ 駒をタップで消去
  </div>

<script>
  const KINDS = ["王", "飛", "角", "金", "銀", "桂", "香", "歩"];
  const PROMOTED = { "飛": "龍", "角": "馬", "銀": "全", "桂": "圭", "香": "杏", "歩": "と" };
  const BACK_RANK = ["香", "桂", "銀", "金", "王", "金", "銀", "桂", "香"];

  // board[i] = { kind, side, promoted } or null (i = row * 9 + col, row 0 is the top)
  const board = Array(81).fill(null);
  const red = Array(81).fill(false);
  const hands = { sente: {}, gote: {} };
  // { from: "palette" | "hand", kind, side } or { from: "erase" } or null
  let selected = null;

  const boardEl = document.getElementById("board");

  function pieceEl(kind, promoted) {
    const el = document.createElement("div");
    el.className = "piece" + (promoted ? " promoted" : "");
    el.textContent = promoted ? PROMOTED[kind] : kind;
    return el;
  }

  function isSelected(from, kind, side) {
    return selected && selected.from === from && selected.kind === kind && selected.side === side;
  }

  function toggleSelect(sel) {
    const same = selected && selected.from === sel.from && selected.kind === sel.kind && selected.side === sel.side;
    selected = same ? null : sel;
    render();
  }

  function addToHand(side, kind, n) {
    const h = hands[side];
    h[kind] = (h[kind] || 0) + n;
    if (h[kind] <= 0) delete h[kind];
    if (!h[kind] && isSelected("hand", kind, side)) selected = null;
  }

  function renderPalette(side) {
    const el = document.getElementById("palette-" + side);
    el.innerHTML = "";
    for (const kind of KINDS) {
      const slot = document.createElement("div");
      slot.className = "slot" + (isSelected("palette", kind, side) ? " selected" : "");
      slot.appendChild(pieceEl(kind, false));
      slot.addEventListener("click", () => toggleSelect({ from: "palette", kind, side }));
      slot.addEventListener("contextmenu", e => e.preventDefault());
      el.appendChild(slot);
    }
  }

  function renderHand(side) {
    const el = document.getElementById("hand-" + side);
    el.innerHTML = "";
    for (const kind of KINDS) {
      const n = hands[side][kind];
      if (!n) continue;
      const slot = document.createElement("div");
      slot.className = "slot" + (isSelected("hand", kind, side) ? " selected" : "");
      slot.appendChild(pieceEl(kind, false));
      if (n > 1) {
        const c = document.createElement("div");
        c.className = "count";
        c.textContent = n;
        slot.appendChild(c);
      }
      slot.addEventListener("click", e => {
        e.stopPropagation();
        if (selected && selected.from === "erase") {
          addToHand(side, kind, -1);
          render();
        } else {
          toggleSelect({ from: "hand", kind, side });
        }
      });
      el.appendChild(slot);
    }
  }

  function renderBoard() {
    boardEl.innerHTML = "";
    for (let i = 0; i < 81; i++) {
      const cell = document.createElement("div");
      cell.className = "cell" + (red[i] ? " red" : "");
      const p = board[i];
      if (p) {
        if (p.side === "gote") cell.classList.add("gote");
        cell.appendChild(pieceEl(p.kind, p.promoted));
      }
      cell.addEventListener("click", () => {
        if (!selected) return;
        if (selected.from === "erase") {
          board[i] = null;
        } else {
          board[i] = { kind: selected.kind, side: selected.side, promoted: false };
          if (selected.from === "hand") addToHand(selected.side, selected.kind, -1);
        }
        render();
      });
      cell.addEventListener("contextmenu", e => {
        e.preventDefault();
        const p = board[i];
        if (p) {
          if (PROMOTED[p.kind]) p.promoted = !p.promoted;
        } else {
          red[i] = !red[i];
        }
        render();
      });
      boardEl.appendChild(cell);
    }
  }

  function render() {
    renderPalette("gote");
    renderPalette("sente");
    renderHand("gote");
    renderHand("sente");
    renderBoard();
    document.getElementById("btn-erase").classList.toggle("selected", !!selected && selected.from === "erase");
  }

  for (const side of ["sente", "gote"]) {
    document.getElementById("hand-" + side).addEventListener("click", () => {
      if (selected && selected.from === "palette") {
        addToHand(side, selected.kind, 1);
        render();
      }
    });
  }

  function clearAll() {
    board.fill(null);
    red.fill(false);
    hands.sente = {};
    hands.gote = {};
    selected = null;
  }

  document.getElementById("btn-hon").addEventListener("click", () => {
    clearAll();
    const put = (row, col, kind, side) => { board[row * 9 + col] = { kind, side, promoted: false }; };
    for (let c = 0; c < 9; c++) {
      put(0, c, BACK_RANK[c], "gote");
      put(2, c, "歩", "gote");
      put(6, c, "歩", "sente");
      put(8, c, BACK_RANK[c], "sente");
    }
    put(1, 1, "飛", "gote");
    put(1, 7, "角", "gote");
    put(7, 1, "角", "sente");
    put(7, 7, "飛", "sente");
    render();
  });

  document.getElementById("btn-erase").addEventListener("click", () => toggleSelect({ from: "erase" }));

  document.getElementById("btn-clear").addEventListener("click", () => {
    clearAll();
    render();
  });

  // ---- 保存 ----
  const STORAGE_KEY = "shogi-saves";

  function loadSaves() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function writeSaves(saves) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saves));
      return true;
    } catch (e) {
      alert("保存できませんでした");
      return false;
    }
  }

  function formatDate(t) {
    const d = new Date(t);
    const z = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}/${z(d.getMonth() + 1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
  }

  document.getElementById("btn-save").addEventListener("click", () => {
    const now = Date.now();
    const name = prompt("保存名", formatDate(now));
    if (name === null) return;
    const saves = loadSaves();
    saves.unshift({
      id: now,
      name: name.trim() || formatDate(now),
      savedAt: now,
      board: board.map(p => p && { ...p }),
      red: [...red],
      hands: { sente: { ...hands.sente }, gote: { ...hands.gote } },
    });
    if (writeSaves(saves)) alert("保存しました");
  });

  const listView = document.getElementById("list-view");
  const detailView = document.getElementById("detail-view");
  let current = null;

  function showList() {
    const ul = document.getElementById("save-list");
    ul.innerHTML = "";
    const saves = loadSaves();
    if (!saves.length) {
      const li = document.createElement("div");
      li.className = "empty";
      li.textContent = "保存された盤面はありません";
      ul.appendChild(li);
    }
    for (const save of saves) {
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.textContent = save.name;
      const date = document.createElement("span");
      date.className = "date";
      date.textContent = formatDate(save.savedAt);
      li.append(name, date);
      li.addEventListener("click", () => showDetail(save));
      ul.appendChild(li);
    }
    detailView.hidden = true;
    listView.hidden = false;
  }

  function showDetail(save) {
    current = save;
    document.getElementById("detail-title").textContent = save.name;
    const b = document.getElementById("detail-board");
    b.innerHTML = "";
    save.board.forEach((p, i) => {
      const cell = document.createElement("div");
      cell.className = "cell" + (save.red[i] ? " red" : "");
      if (p) {
        if (p.side === "gote") cell.classList.add("gote");
        cell.appendChild(pieceEl(p.kind, p.promoted));
      }
      b.appendChild(cell);
    });
    for (const side of ["sente", "gote"]) {
      const el = document.getElementById("detail-hand-" + side);
      el.innerHTML = "";
      for (const kind of KINDS) {
        const n = save.hands[side][kind];
        if (!n) continue;
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.appendChild(pieceEl(kind, false));
        if (n > 1) {
          const c = document.createElement("div");
          c.className = "count";
          c.textContent = n;
          slot.appendChild(c);
        }
        el.appendChild(slot);
      }
    }
    listView.hidden = true;
    detailView.hidden = false;
  }

  document.getElementById("btn-list").addEventListener("click", showList);
  document.querySelector("#list-view [data-close]").addEventListener("click", () => { listView.hidden = true; });
  document.getElementById("btn-back").addEventListener("click", showList);

  document.getElementById("btn-load").addEventListener("click", () => {
    clearAll();
    current.board.forEach((p, i) => { board[i] = p && { ...p }; });
    current.red.forEach((r, i) => { red[i] = r; });
    hands.sente = { ...current.hands.sente };
    hands.gote = { ...current.hands.gote };
    detailView.hidden = true;
    render();
  });

  document.getElementById("btn-delete").addEventListener("click", () => {
    if (!confirm(`「${current.name}」を削除しますか？`)) return;
    writeSaves(loadSaves().filter(s => s.id !== current.id));
    showList();
  });

  render();
</script>
</body>
</html>
